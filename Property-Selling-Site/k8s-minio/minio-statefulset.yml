apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: urban-hive-minio

spec:
  serviceName: minio-service
  replicas: 1

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
        - name: minio-container
          image: quay.io/minio/aistor/minio:latest

          command:
            - minio

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: minio-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: minio-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 4Gi







