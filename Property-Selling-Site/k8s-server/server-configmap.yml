apiVersion: v1
kind: ConfigMap

metadata:
  name: server-config
  namespace: urban-hive-backend

data:
  NODE_ENV: "development"
  PORT: "4000"

  STRICT_VALIDATION: "false"
  RUN_SEED_ON_STARTUP: "true"

  JWT_EXPIRES_IN: "8h"

  CORS_ORIGINS: "http://10.11.119.245,http://10.11.119.246,http://10.11.119.247,http://10.11.119.248,http://10.11.119.249,http://10.11.119.250"

  MINIO_ENDPOINT: "minio-service.urban-hive-minio.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "housing-files"

  LOGIN_RATE_LIMIT_WINDOW_MS: "900000"
  LOGIN_RATE_LIMIT_MAX: "50"
  LOGIN_RATE_LIMIT_IP_MAX: "100"

  DEFAULT_ADMIN_USERNAME: "admin"
  DEFAULT_ADMIN_EMAIL: "admin@royalpalm.com"
  DEFAULT_ADMIN_FULL_NAME: "Administrator"

  TEST_DATABASE_URL: ""
  RUN_DATABASE_INTEGRATION_TESTS: "false"