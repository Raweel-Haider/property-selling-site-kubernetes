apiVersion: apps/v1
kind: Deployment

metadata:
  name: client-deployment
  namespace: urban-hive-frontend

  labels:
    app: client

spec:
  replicas: 1

  selector:
    matchLabels:
      app: client

  template:
    metadata:
      labels:
        app: client

    spec:
      containers:
        - name: client-container

          image: raweel1/property-selling-client:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80